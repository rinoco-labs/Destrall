name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      force:
        description: Build and publish even if the version field did not change on this commit
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "app/package.json"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-release:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail

          write_summary() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          skip_release() {
            local reason="$1"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${reason}"
            write_summary "## Release skipped"
            write_summary ""
            write_summary "${reason}"
            write_summary ""
            write_summary "**To publish a release:** bump the \`version\` field in \`app/package.json\` and push to \`main\`, or run this workflow manually with **force** enabled."
          }

          read_version() {
            node -p "require('./app/package.json').version"
          }

          current="$(read_version)"
          write_summary "## Release resolution"
          write_summary ""
          write_summary "Current \`app/package.json\` version: **${current}**"

          # Manual run — release package.json version (optionally forced).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${current}"
            if [ "${FORCE_RELEASE}" != "true" ] && git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
              skip_release "Tag \`${tag}\` already exists. Enable **force** on workflow_dispatch to rebuild and replace release assets."
              exit 0
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "version=${current}" >> "$GITHUB_OUTPUT"
            write_summary ""
            write_summary "Manual release: **${tag}** (force=${FORCE_RELEASE})"
            exit 0
          fi

          # Tag push — release for the pushed tag.
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            write_summary ""
            write_summary "Tag push: **${tag}**"
            exit 0
          fi

          # Main push — release only when the version *field* changed (not lockfile-only edits).
          if ! git show HEAD~1:app/package.json > /tmp/previous-package.json 2>/dev/null; then
            skip_release "No previous \`app/package.json\` on \`main\`; cannot detect a version bump."
            exit 0
          fi

          previous="$(node -p "require('/tmp/previous-package.json').version")"
          write_summary ""
          write_summary "Previous version: **${previous}**"

          if [ "${current}" = "${previous}" ]; then
            skip_release "The \`version\` field in \`app/package.json\` did not change (${current}). Dependency or script-only edits do not trigger a release."
            exit 0
          fi

          tag="v${current}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            skip_release "Tag \`${tag}\` already exists. Bump \`version\` in \`app/package.json\` (for example to 0.0.2) or run this workflow manually with **force**."
            exit 0
          fi

          echo "Version bumped: ${previous} -> ${current}"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${current}" >> "$GITHUB_OUTPUT"
          write_summary ""
          write_summary "Version bumped **${previous} → ${current}**. Building **${tag}**."

  build-macos-arm64:
    name: macOS arm64
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Make Electron app (arm64)
        run: npm run make -- --platform=darwin --arch=arm64

      - name: Verify node-llama-cpp packaging
        run: npm run verify:packaged-llama

      - name: Prepare macOS arm64 artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          APP_PATH="out/Destrall-darwin-arm64/Destrall.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="$(find out -path '*darwin*arm64*' -name 'Destrall.app' -maxdepth 3 | head -n 1)"
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Could not find arm64 .app bundle"
            find out -maxdepth 4 -print
            exit 1
          fi
          hdiutil create -volname "Destrall" -srcfolder "$APP_PATH" -ov -format UDZO \
            "release-artifacts/Destrall-mac-arm64.dmg"
          ZIP_FILE="$(find out/make -path '*darwin*arm64*' -name '*.zip' | head -n 1 || true)"
          if [ -n "$ZIP_FILE" ]; then
            cp "$ZIP_FILE" "release-artifacts/Destrall-mac-arm64.zip"
          fi

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Destrall-mac-arm64
          path: app/release-artifacts/Destrall-mac-arm64.*
          if-no-files-found: error

  build-macos-x64:
    name: macOS x64
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    # macos-13 is retired; Intel macOS builds use the dedicated x64 runner image.
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Make Electron app (x64)
        run: npm run make -- --platform=darwin --arch=x64

      - name: Verify node-llama-cpp packaging
        run: npm run verify:packaged-llama

      - name: Prepare macOS x64 artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          APP_PATH="out/Destrall-darwin-x64/Destrall.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="$(find out -path '*darwin*x64*' -name 'Destrall.app' -maxdepth 3 | head -n 1)"
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Could not find x64 .app bundle"
            find out -maxdepth 4 -print
            exit 1
          fi
          hdiutil create -volname "Destrall" -srcfolder "$APP_PATH" -ov -format UDZO \
            "release-artifacts/Destrall-mac-x64.dmg"
          ZIP_FILE="$(find out/make -path '*darwin*x64*' -name '*.zip' | head -n 1 || true)"
          if [ -n "$ZIP_FILE" ]; then
            cp "$ZIP_FILE" "release-artifacts/Destrall-mac-x64.zip"
          fi

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Destrall-mac-x64
          path: app/release-artifacts/Destrall-mac-x64.*
          if-no-files-found: error

  build:
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            artifact_name: Destrall-windows-x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact_name: Destrall-linux-x64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot rpm libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Make Electron app
        run: npm run make -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Verify node-llama-cpp packaging
        run: npm run verify:packaged-llama

      - name: Prepare artifacts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Get-ChildItem -Path out/make -Recurse -File | Where-Object {
            $_.Extension -in ".exe", ".msi", ".zip"
          } | ForEach-Object { Write-Output $_.FullName }

          $exe = Get-ChildItem -Path out/make -Recurse -File -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "No Windows installer (.exe) found under out/make"
          }
          Copy-Item $exe.FullName "release-artifacts/${{ matrix.artifact_name }}.exe"

      - name: Prepare artifacts on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          APPIMAGE_FILE="$(find out/make -type f -name '*.AppImage' | head -n 1 || true)"
          DEB_FILE="$(find out/make -type f -name '*.deb' | head -n 1 || true)"
          RPM_FILE="$(find out/make -type f -name '*.rpm' | head -n 1 || true)"

          if [ -n "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" "release-artifacts/${{ matrix.artifact_name }}.AppImage"
          fi
          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" "release-artifacts/${{ matrix.artifact_name }}.deb"
          fi
          if [ -n "$RPM_FILE" ]; then
            cp "$RPM_FILE" "release-artifacts/${{ matrix.artifact_name }}.rpm"
          fi

          if [ ! -f "release-artifacts/${{ matrix.artifact_name }}.deb" ] && [ ! -f "release-artifacts/${{ matrix.artifact_name }}.rpm" ]; then
            echo "No Linux package artifacts found"
            find out/make -type f -print
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: app/release-artifacts/*
          if-no-files-found: error

  release:
    needs: [resolve-release, build-macos-arm64, build-macos-x64, build]
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Display artifacts
        run: find downloaded-artifacts -type f -maxdepth 3 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.release_tag }}
          name: Destrall ${{ needs.resolve-release.outputs.version }}
          files: downloaded-artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
